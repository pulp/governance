name: Sync to pulp/.github

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '.github/scripts/sync_governance_files.py'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PULP_APP_ID }}
          private-key: ${{ secrets.PULP_APP_PRIVATE_KEY }}
          owner: pulp
          repositories: .github
          permission-contents: write

      - name: Checkout governance repository
        uses: actions/checkout@v7
        with:
          path: governance

      - name: Checkout pulp/.github repository
        uses: actions/checkout@v7
        with:
          repository: pulp/.github
          token: ${{ steps.app-token.outputs.token }}
          path: dot-github

      - name: Run sync script
        run: |
          python3 governance/.github/scripts/sync_governance_files.py \
            governance \
            dot-github

      - name: Commit and push changes
        working-directory: dot-github
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "pulp-app[bot]"
          git config user.email "pulp-app[bot]@users.noreply.github.com"
          git add SECURITY.md CODE_OF_CONDUCT.md CONTRIBUTING.md
          git commit -m "Sync community health files from pulp/governance"
          git push
